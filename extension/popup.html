<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Save to Riff</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <form id="form" autocomplete="off" spellcheck="false">
      <header>
        <img src="icons/icon-32.png" alt="" width="18" height="18" />
        <span class="brand">Save to Riff</span>
        <button type="button" id="favorite" class="star" aria-pressed="false" title="Favorite">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" /></svg>
        </button>
      </header>

      <div id="status" class="status" role="status"></div>

      <label class="field">
        <span>Title</span>
        <input id="title" placeholder="Song title" />
      </label>
      <label class="field">
        <span>Artist</span>
        <input id="artist" placeholder="Artist" />
      </label>
      <label class="field">
        <span>Tuning</span>
        <input id="tuning" list="tunings" placeholder="Standard, Drop D, DADGBE…" />
        <datalist id="tunings"></datalist>
      </label>
      <div class="field">
        <span>Tags</span>
        <div class="tags" id="tagbox">
          <input id="tag-input" list="tag-list" placeholder="Add tags…" />
          <datalist id="tag-list"></datalist>
        </div>
      </div>

      <footer>
        <span class="hint" id="hint">Saves when closed · <kbd>↩</kbd> done</span>
        <button type="button" id="discard" class="discard">Discard</button>
      </footer>
    </form>
    <script type="module" src="popup.js"></script>
  </body>
</html>
